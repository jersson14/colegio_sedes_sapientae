# CI de calidad y seguridad (Fase 1 del plan de trabajo).
# Regla: con este workflow en rojo no se mergea a main.
name: Calidad

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: calidad-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: Lint, seguridad, estilo, PHPStan y pruebas unitarias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks revisa todo el historial

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring, fileinfo, intl
          coverage: none
          tools: composer:v2

      - name: Dependencias
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Vulnerabilidades conocidas en dependencias
        run: composer audit

      - name: Sintaxis de todo el PHP (php -l)
        run: php tools/lint.php

      - name: Todo endpoint pasa por el guard de sesión
        run: php tools/verificar_guard.php

      - name: Matriz de roles alineada con la interfaz
        run: python3 tools/analizar_roles.py . "$RUNNER_TEMP/roles.json" --estricto

      - name: Estilo PSR-12
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: Análisis estático (PHPStan)
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Pruebas unitarias
        run: vendor/bin/phpunit --testsuite=Unit

      - name: Secretos en el historial (gitleaks)
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o checksums.txt \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep "linux_x64.tar.gz" checksums.txt | sed 's/ .*/  gitleaks.tar.gz/' | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git . --log-opts="--all" --redact --no-banner

  integracion:
    name: Esquema (Phinx) y pertenencia del dato contra MariaDB
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.4 # misma versión que el XAMPP del proyecto
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: colegio_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_NAME: colegio_ci
      DB_USER: root
      DB_PASS: root
      DB_MIGRACION_USER: root
      DB_MIGRACION_PASS: root
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring, fileinfo, intl
          coverage: none
          tools: composer:v2

      - name: Dependencias
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Crear el esquema con las migraciones
        run: vendor/bin/phinx migrate -c phinx.php

      - name: Cargar los datos de prueba (anonimizados)
        run: PERMITIR_DATOS_PRUEBA=1 vendor/bin/phinx seed:run -s DatosPrueba -c phinx.php

      - name: Pruebas de integración
        run: vendor/bin/phpunit --testsuite=Integration

  e2e:
    name: Caracterización y flujos E2E (Chrome)
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: colegio_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_NAME: colegio_ci
      DB_MIGRACION_USER: root
      DB_MIGRACION_PASS: root
      BASE_URL: http://127.0.0.1:8099/
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mysqli, mbstring, fileinfo, intl, gd
          coverage: none
          tools: composer:v2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Dependencias
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          (cd tests/E2E && npm ci --no-audit --no-fund)

      - name: Esquema y datos de prueba
        run: |
          vendor/bin/phinx migrate -c phinx.php
          PERMITIR_DATOS_PRUEBA=1 vendor/bin/phinx seed:run -s DatosPrueba -c phinx.php

      - name: Levantar la aplicación (fecha congelada en 2025-12-26)
        run: |
          mkdir -p "$RUNNER_TEMP/sesiones" "$RUNNER_TEMP/intentos"
          cat > "$RUNNER_TEMP/colegio.env" <<EOF
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_NAME=colegio_ci
          DB_USER=root
          DB_PASS=root
          APP_DEBUG=false
          APP_ENTORNO=prueba
          DB_FECHA_PRUEBA=2025-12-26 12:00:00
          LOGIN_LIMITE_DIR=$RUNNER_TEMP/intentos
          EOF
          COLEGIO_ENV="$RUNNER_TEMP/colegio.env" nohup php -d session.save_path="$RUNNER_TEMP/sesiones"             -S 127.0.0.1:8099 -t . tests/E2E/router.php > "$RUNNER_TEMP/servidor.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null "$BASE_URL" && break; sleep 1; done

      - name: Caracterización (respuestas idénticas a la grabación)
        working-directory: tests/E2E
        run: node caracterizacion.mjs verificar

      - name: Reportes PDF (HTML idéntico a la grabación)
        if: success() || failure()
        run: COLEGIO_ENV="$RUNNER_TEMP/colegio.env" php tools/caracterizar_reportes.php verificar

      - name: Flujos E2E (escriben en la BD; van después)
        if: success() || failure() # independientes del resultado de la caracterización
        working-directory: tests/E2E
        run: node flujos.mjs

      - name: Log del servidor si algo falló
        if: failure()
        # También como anotaciones: los logs del job exigen permisos de administrador; las anotaciones no.
        run: |
          tail -100 "$RUNNER_TEMP/servidor.log"
          grep -iE "error|warning|fatal|exception" "$RUNNER_TEMP/servidor.log" | tail -20 | cut -c1-900 | sed 's/^/::warning title=Servidor PHP::/'

  multitenant:
    name: Modo multiple (migraciones en N bases y aislamiento entre colegios)
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.4
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: root
      DB_PASS: root
      MAESTRO_DB_NAME: sge_maestro_ci
      DB_NAME_A: prueba_tenant_a
      DB_NAME_B: prueba_tenant_b
      BASE_URL: http://127.0.0.1:8098/
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mysqli, mbstring, fileinfo, intl, curl
          coverage: none
          tools: composer:v2

      - name: Dependencias
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Configuración en modo multiple
        run: |
          mkdir -p "$RUNNER_TEMP/sesiones" "$RUNNER_TEMP/intentos"
          cat > "$RUNNER_TEMP/colegio.env" <<EOF
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_NAME=no_se_usa
          DB_USER=root
          DB_PASS=root
          APP_DEBUG=false
          APP_ENTORNO=prueba
          DB_FECHA_PRUEBA=2025-12-26 12:00:00
          LOGIN_LIMITE_DIR=$RUNNER_TEMP/intentos
          MODO_TENANT=multiple
          TENANT_DOMINIO=prueba.test
          MAESTRO_DB_NAME=$MAESTRO_DB_NAME
          RESPALDO_DIR=$RUNNER_TEMP/respaldos
          EOF
          for bd in "$MAESTRO_DB_NAME" "$DB_NAME_A" "$DB_NAME_B"; do
            mysql -h 127.0.0.1 -uroot -proot -e "CREATE DATABASE \`$bd\` CHARACTER SET utf8mb4"
          done

      - name: Migraciones en la maestra y en cada colegio (tools/migrar_tenants.php)
        env:
          COLEGIO_ENV: ${{ runner.temp }}/colegio.env
        run: |
          php tools/migrar_tenants.php
          mysql -h 127.0.0.1 -uroot -proot "$MAESTRO_DB_NAME" -e "INSERT INTO tenants (slug, razon_social, base_datos, estado)
            VALUES ('colegio-a', 'Colegio A', '$DB_NAME_A', 'ACTIVO'), ('colegio-b', 'Colegio B', '$DB_NAME_B', 'ACTIVO')"
          php tools/migrar_tenants.php
          php tools/migrar_tenants.php status | grep -q " down " && { echo "::error title=Migraciones::quedaron migraciones sin aplicar"; exit 1; } || true

      - name: Los mismos datos de prueba en los dos colegios
        run: |
          for bd in "$DB_NAME_A" "$DB_NAME_B"; do
            DB_NAME="$bd" DB_MIGRACION_USER=root DB_MIGRACION_PASS=root PERMITIR_DATOS_PRUEBA=1               vendor/bin/phinx seed:run -s DatosPrueba -c phinx.php
          done

      - name: Pruebas de integración de la BD maestra
        run: DB_NAME="$DB_NAME_A" vendor/bin/phpunit --testsuite=Integration --filter 'TenantsMaestroTest|AltaInstitucionTest'

      - name: Alta de un colegio con la herramienta (tools/alta_tenant.php)
        env:
          COLEGIO_ENV: ${{ runner.temp }}/colegio.env
        run: |
          php tools/alta_tenant.php --slug=colegio-alta --razon="Colegio Alta CI" --email=ci@example.com             --admin-dni=12345678 --admin-nombres=Ana --admin-apellidos=Perez | tee "$RUNNER_TEMP/alta.txt"
          grep -q "Institución creada" "$RUNNER_TEMP/alta.txt"
          # Con «!» delante bash no corta el paso: la repetición se comprueba explícitamente.
          if php tools/alta_tenant.php --slug=colegio-alta --razon=X --email=ci@example.com --admin-dni=12345678 --admin-nombres=Ana --admin-apellidos=Perez; then
            echo "::error title=Alta::un slug repetido no debía darse de alta"; exit 1
          fi
          php tools/migrar_tenants.php --solo=colegio-alta

      - name: Tareas programadas por cron en cada colegio (tools/tareas_programadas.php)
        run: COLEGIO_ENV="$RUNNER_TEMP/colegio.env" php tools/tareas_programadas.php

      - name: Aislamiento entre colegios (tests/E2E/aislamiento.php)
        run: |
          COLEGIO_ENV="$RUNNER_TEMP/colegio.env" nohup php -d session.save_path="$RUNNER_TEMP/sesiones"             -S 127.0.0.1:8098 -t . tests/E2E/router.php > "$RUNNER_TEMP/servidor.log" 2>&1 &
          for i in $(seq 1 30); do curl -s -o /dev/null "$BASE_URL" && break; sleep 1; done
          php tests/E2E/aislamiento.php

      - name: Respaldo y restauración de un colegio (tools/respaldo_tenant.php)
        env:
          COLEGIO_ENV: ${{ runner.temp }}/colegio.env
        run: |
          # Los logs del job piden permisos de administrador: la salida de cada paso va también como anotación.
          registro="$RUNNER_TEMP/respaldo.log"
          trap 'echo "::error title=Respaldo::$(tail -c 900 "$registro" | tr "\n" " ")"' ERR
          respaldo_tenant() { php tools/respaldo_tenant.php "$@" 2>&1 | tee -a "$registro"; }
          contar() { mysql -h 127.0.0.1 -uroot -proot -N -e "SELECT COUNT(*) FROM \`$1\`.alumnos"; }
          antes=$(contar "$DB_NAME_B")
          respaldo_tenant respaldar --tenant=colegio-b
          respaldo=$(ls -d "$RUNNER_TEMP"/respaldos/colegio-b-* | tail -1)
          respaldo_tenant verificar --desde="$respaldo"
          if grep -q DEFINER "$respaldo/base.sql"; then echo "::error title=Respaldo::el volcado conserva DEFINER"; exit 1; fi
          # Se pierden los datos de B; la restauración los devuelve en una base nueva y la activa.
          mysql -h 127.0.0.1 -uroot -proot -e "SET FOREIGN_KEY_CHECKS=0; DELETE FROM \`$DB_NAME_B\`.alumnos"
          respaldo_tenant restaurar --desde="$respaldo" --activar
          nueva=$(mysql -h 127.0.0.1 -uroot -proot -N -e "SELECT base_datos FROM \`$MAESTRO_DB_NAME\`.tenants WHERE slug='colegio-b'")
          [ "$nueva" != "$DB_NAME_B" ] && [ "$(contar "$nueva")" = "$antes" ] || { echo "::error title=Restauración::$nueva tiene $(contar "$nueva") alumnos, se esperaban $antes. $(tail -c 700 "$registro" | tr '\n' ' ')"; exit 1; }
          # Un respaldo alterado no se restaura.
          echo "-- alterado" >> "$respaldo/base.sql"
          if php tools/respaldo_tenant.php restaurar --desde="$respaldo" >> "$registro" 2>&1; then echo "::error title=Respaldo::se restauró un respaldo alterado"; exit 1; fi

      - name: Log del servidor si algo falló
        if: failure()
        run: |
          tail -60 "$RUNNER_TEMP/servidor.log" || true
          grep -iE "error|warning|fatal|exception" "$RUNNER_TEMP/servidor.log" | tail -10 | cut -c1-900 | sed 's/^/::warning title=Servidor PHP::/' || true
